[workspace]
resolver = "2"
members = [
    "crates/oxidepress-core",
    "crates/oxidepress-db",
    "crates/oxidepress-query",
    "crates/oxidepress-auth",
    "crates/oxidepress-themes",
    "crates/oxidepress-api",
    "crates/oxidepress-admin",
    "crates/oxidepress-plugins",
    "crates/oxidepress-migrate",
    "crates/oxidepress-cache",
    "crates/oxidepress-cron",
    "crates/oxidepress-server",
    "crates/oxidepress-cli",
    "crates/oxidepress-e2e",
    "crates/oxidepress-seo",
    "crates/oxidepress-forms",
    "crates/oxidepress-fields",
    "crates/oxidepress-multisite",
    "crates/oxidepress-commerce",
    "crates/oxidepress-security",
    "crates/oxidepress-i18n",
    "crates/oxidepress-blocks",
    "crates/oxidepress-rustify",
    "crates/oxidepress-php",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0"
authors = ["Vabian124"]
description = "OxidePress - a WordPress-compatible CMS built in Rust. Independent fork of RustPress."

[workspace.metadata.wp-compat]
wordpress-db-schema = "7.1.4"
target-compat = "full"
phase = "8"

[workspace.dependencies]
# Internal crates
oxidepress-core = { path = "crates/oxidepress-core" }
oxidepress-db = { path = "crates/oxidepress-db" }
oxidepress-query = { path = "crates/oxidepress-query" }
oxidepress-auth = { path = "crates/oxidepress-auth" }
oxidepress-themes = { path = "crates/oxidepress-themes" }
oxidepress-api = { path = "crates/oxidepress-api" }
oxidepress-admin = { path = "crates/oxidepress-admin" }
oxidepress-plugins = { path = "crates/oxidepress-plugins" }
oxidepress-migrate = { path = "crates/oxidepress-migrate" }
oxidepress-cache = { path = "crates/oxidepress-cache" }
oxidepress-cron = { path = "crates/oxidepress-cron" }
oxidepress-seo = { path = "crates/oxidepress-seo" }
oxidepress-forms = { path = "crates/oxidepress-forms" }
oxidepress-fields = { path = "crates/oxidepress-fields" }
oxidepress-multisite = { path = "crates/oxidepress-multisite" }
oxidepress-security = { path = "crates/oxidepress-security" }
oxidepress-i18n = { path = "crates/oxidepress-i18n" }
oxidepress-blocks = { path = "crates/oxidepress-blocks" }
oxidepress-commerce = { path = "crates/oxidepress-commerce" }
oxidepress-rustify = { path = "crates/oxidepress-rustify" }
oxidepress-php = { path = "crates/oxidepress-php" }

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip", "set-header"] }
tower = "0.5"

# ORM (MySQL for WP database compatibility)
sea-orm = { version = "1.1", features = [
    "sqlx-mysql",
    "runtime-tokio-native-tls",
    "macros",
] }

# Template engine
tera = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Configuration
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Cache
moka = { version = "0.12", features = ["future", "sync"] }

# Hashing
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"

# Base64 encoding/decoding (for XML-RPC media upload)
base64 = "0.22"

# Async
async-trait = "0.1"

# Regex
regex = "1"

# Image processing
image = "0.25"

# MIME type detection (magic bytes)
infer = "0.16"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# WASM runtime
wasmtime = { version = "42", default-features = false, features = ["cranelift", "runtime"] }
wat = "1"
